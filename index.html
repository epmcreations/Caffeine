<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caffeine</title>
  
  <!-- Favicon and iOS App Icon -->
  <link rel="icon" type="image/png" href="https://em-content.zobj.net/source/twitter/450/hot-beverage_2615.png">
  <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/twitter/450/hot-beverage_2615.png">
  
  <!-- Web Application Manifest (Embedded via Data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Caffeine","short_name":"Caffeine","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://em-content.zobj.net/source/twitter/450/hot-beverage_2615.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Web App Theme Meta Tags -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background-color: #000000;
      color: #000000;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen w-screen overflow-hidden select-none">

  <!-- Centered Twemoji Coffee Emoji -->
  <img 
    src="https://em-content.zobj.net/source/twitter/450/hot-beverage_2615.png" 
    alt="Coffee Emoji" 
    class="w-32 h-32 sm:w-48 sm:h-48 md:w-64 md:h-64 object-contain pointer-events-none transform transition-transform duration-300 active:scale-95"
    id="coffee-icon"
  />

  <script>
    // 1. Inline Service Worker Registration using a Blob URL for single-file PWA compliance
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'caffeine-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(self.skipWaiting());
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(self.clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.log('Service Worker registration error:', err));
    }

    // 2. Screen Wake Lock API Logic
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.error(`Wake Lock error: ${err.name}, ${err.message}`);
      }
    }

    // Re-acquire lock on visibility change when coming back to tab
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // Automatically request wake lock on page load
    window.addEventListener('DOMContentLoaded', () => {
      requestWakeLock();
    });

    // Fallback trigger on screen click/tap to bypass strict autoplay/gestures policies
    document.body.addEventListener('click', () => {
      if (!wakeLock) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
